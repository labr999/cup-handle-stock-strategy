name: Cup Handle Scan

on:
  schedule:
    # 台灣時間 14:30(UTC 06:30),週一至週五;收盤後資料已更新
    - cron: "30 6 * * 1-5"
  workflow_dispatch:   # 可在手機 GitHub 手動執行

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan and push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_scan.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cup-handle-scan
          path: cup_handle_scan.csv
          if-no-files-found: ignore
